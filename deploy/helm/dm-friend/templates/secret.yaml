{{- if not .Values.openai.existingSecret }}
# Templated only when openai.existingSecret is unset. Defaults to an EMPTY key;
# supply the real value at install time (--set openai.apiKey=...) or use existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dm-friend.secretName" . }}
  labels:
    {{- include "dm-friend.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.openai.apiKeySecretKey }}: {{ .Values.openai.apiKey | default "" | b64enc | quote }}
{{- end }}
